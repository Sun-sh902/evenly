name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Start an Evenly server for the end-to-end test
        run: |
          EVENLY_DB="$RUNNER_TEMP/ci.db" QUIET=1 EVENLY_RATE_LIMIT=off node src/server.js &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/api/health && break; sleep 1; done
      - name: Build and test the iOS app
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Using simulator $UDID"
          xcodebuild test \
            -project ios/Evenly.xcodeproj \
            -scheme Evenly \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t evenly:ci .
      - name: Smoke test container
        run: |
          docker run -d --name evenly -p 4173:4173 evenly:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/api/health && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:4173/api/groups \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI","members":["A","B"]}' | grep -q '"revision":1'
          curl -fsS http://127.0.0.1:4173/ | grep -q '<title>Evenly'
