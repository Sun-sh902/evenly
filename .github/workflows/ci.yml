name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t evenly:ci .
      - name: Smoke test container
        run: |
          docker run -d --name evenly -p 4173:4173 evenly:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/api/health && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:4173/api/groups \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI","members":["A","B"]}' | grep -q '"revision":1'
          curl -fsS http://127.0.0.1:4173/ | grep -q '<title>Evenly'
