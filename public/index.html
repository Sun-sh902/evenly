<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Evenly - split costs, keep friends</title>
  <meta name="description" content="Split shared costs with anyone. No accounts, no app install, no daily limits.">
  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" data-link aria-label="Evenly home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="16" r="8.5"/><circle cx="20" cy="16" r="8.5"/></svg>
      <span>Evenly</span>
    </a>
    <div class="topbar-actions">
      <a class="btn btn-ghost btn-sm" id="newGroupLink" href="/" data-link hidden>New group</a>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle colour theme">
        <svg class="i i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1">
    <div class="boot"><span class="spinner"></span></div>
  </main>

  <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle"></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
